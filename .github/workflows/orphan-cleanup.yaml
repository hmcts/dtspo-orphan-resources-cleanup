name: orphaned-resource-cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Az CLI login
        uses: azure/login@v2
        with:
          client-id: c670b53f-74bc-4fa8-82c6-5577e8600d2a # DTSPO Orphaned Resource Cleanup
          tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082 # HMCTS.NET
          allow-no-subscriptions: true
      - name: Install Resource Graph CLI extension
        run: az extension add --name resource-graph --only-show-errors
      - name: Preview orphan-resource candidates (no deletion)
        run: |
          mkdir -p preview
          bash scripts/orphan-cleanup.sh -m dry-run > preview/orphan-resources.json
          jq '{mode, checkedAt, summary, warning}' preview/orphan-resources.json
      - name: Upload preview for review
        uses: actions/upload-artifact@v4
        with:
          name: orphan-resource-preview
          path: preview/orphan-resources.json
          if-no-files-found: error
          retention-days: 7
